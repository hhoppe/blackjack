[tool.autopep8]
indent_size = 2
ignore = "E111,E114,E121,E125,E126,E129,E226,E302,E305,E501,W504,E741,E20,W503,E731"
aggressive = 3
recursive = true
exclude = ".ipynb_checkpoints,Other,blackjack_other*"

[tool.mypy]
ignore_missing_imports = true
strict = true
files = ["."]
exclude = "^(Other)/|^blackjack_other"

[[tool.mypy.overrides]]
module = ["numba.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pyink]
pyink-indentation = 2
line-length = 100  # Default is 88.
pyink-use-majority-quotes = true
extend-exclude = "(\\.ipynb$|^/(Other)/)"

[tool.pylint.main]
disable = [
    "fixme", "redefined-builtin", "cell-var-from-loop",
    "using-constant-test", "simplifiable-condition", "import-outside-toplevel", "line-too-long",
    "too-many-lines", "too-few-public-methods", "too-many-arguments", "too-many-locals",
    "use-dict-literal", "unnecessary-lambda-assignment",
    # Local.
    "too-many-instance-attributes", "too-many-statements", "too-many-positional-arguments",
    "too-many-function-args", "too-many-branches",
    "missing-module-docstring",
]
reports = false
score = false
recursive = true
ignore-paths = [".*ipynb_checkpoints", "Other", "blackjack_other*"]

[tool.pylint.basic]
good-names-rgxs = "^[a-z][a-z0-9]?|[A-Z]([A-Z_]*[A-Z])?$"

[tool.pylint.format]
indent-string = "  "
expected-line-ending-format = "LF"

[tool.pyrefly]
min-severity = "warn"
replace-imports-with-any = ["numba.*"]
project-excludes = ["*.ipynb", "Other", "blackjack_other*"]

[tool.pyrefly.errors]
untyped-import = false
unnecessary-type-conversion = false
redundant-condition = false

[tool.ruff]
extend-exclude = ["*.ipynb", "Other", "blackjack_other*"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "B", "C", "UP", "SIM", "RUF", "NPY", "PTH", "PERF",
    "ISC", "ICN", "PIE", "RET", "TID", "TC", "I",
]
extend-ignore = [
    "E402", "E501", "E721", "E741",
    "B010", "B028", "C408", "C901",
    "TC003", "TC006", "SIM300", "ICN001", "RET504", "SIM905", "RUF005",
    "B008", "B027", "C406", "E731",
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?)|unused_.*)$"
